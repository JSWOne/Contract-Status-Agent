steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.contract-logging
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/contract-agents/contract-logging-agent:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/contract-agents/contract-logging-agent:$BUILD_ID

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/contract-agents/contract-logging-agent:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
